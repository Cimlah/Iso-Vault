# Read-only share that Windows Setup installs from.
[global]
    server role = standalone server
    workgroup = WORKGROUP
    security = user
    map to guest = never
    server min protocol = SMB2
    disable netbios = yes
    smb ports = 445
    interfaces = @@IFACE@@
    bind interfaces only = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    log file = /dev/stdout
    logging = stdout
    log level = 1
    # Extracted ISOs are symlinks into the data folder.
    follow symlinks = yes
    wide links = yes
    allow insecure wide links = yes
    unix extensions = no
    private dir = @@RUN_DIR@@/samba/private
    lock directory = @@RUN_DIR@@/samba/lock
    state directory = @@RUN_DIR@@/samba/state
    cache directory = @@RUN_DIR@@/samba/cache
    pid directory = @@RUN_DIR@@/samba
    ncalrpc dir = @@RUN_DIR@@/samba/ncalrpc
    passdb backend = tdbsam

[isovault]
    path = @@RUN_DIR@@/mnt
    read only = yes
    browseable = no
    guest ok = no
    valid users = isovault
