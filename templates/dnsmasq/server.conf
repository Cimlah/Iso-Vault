# server mode: Iso-Vault is the LAN's DHCP server.
log-dhcp
dhcp-leasefile=@@LEASE_FILE@@
dhcp-range=@@RANGE_START@@,@@RANGE_END@@,@@NETMASK@@,@@LEASE_TIME@@
@@ROUTER_LINE@@
@@DNS_LINE@@

dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:x64,option:client-arch,7
dhcp-match=set:x64,option:client-arch,9
dhcp-match=set:arm64,option:client-arch,11
dhcp-boot=tag:bios,undionly.kpxe,,@@SERVER_IP@@
dhcp-boot=tag:x64,snponly-x64.efi,,@@SERVER_IP@@
dhcp-boot=tag:arm64,snponly-arm64.efi,,@@SERVER_IP@@

# UEFI HTTP Boot clients ask for a URL instead of a TFTP filename.
dhcp-match=set:http-x64,option:client-arch,16
dhcp-match=set:http-arm64,option:client-arch,19
dhcp-boot=tag:http-x64,http://@@SERVER_IP@@:@@BOOT_PORT@@/loaders/snponly-x64.efi
dhcp-boot=tag:http-arm64,http://@@SERVER_IP@@:@@BOOT_PORT@@/loaders/snponly-arm64.efi
dhcp-option-force=tag:http-x64,60,HTTPClient
dhcp-option-force=tag:http-arm64,60,HTTPClient
