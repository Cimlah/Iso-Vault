# proxy mode: boot info alongside the LAN's DHCP server. No leases are handed out.
log-dhcp
dhcp-range=@@NETWORK@@,proxy,@@NETMASK@@

# Firmware PXE clients use the PXE menu protocol to find their loader.
pxe-prompt=tag:!ipxe,"Iso-Vault",0
pxe-service=tag:!ipxe,x86PC,"Iso-Vault BIOS",undionly.kpxe
pxe-service=tag:!ipxe,X86-64_EFI,"Iso-Vault x64 UEFI",snponly-x64.efi
pxe-service=tag:!ipxe,BC_EFI,"Iso-Vault x64 UEFI",snponly-x64.efi
pxe-service=tag:!ipxe,ARM64_EFI,"Iso-Vault ARM64 UEFI",snponly-arm64.efi

# The iPXE ROMs in SeaBIOS VMs, such as Proxmox's, get stuck partway through that protocol. They
# already run iPXE, so they go straight to the script. This also tells our own loaders where the
# server is.
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:ipxe,boot.ipxe,,@@SERVER_IP@@
