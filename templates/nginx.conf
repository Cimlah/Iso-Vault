# Boot port only. The web UI runs separately, so booting survives a UI failure.
user nginx;
worker_processes auto;
daemon off;
pid @@RUN_DIR@@/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    log_format compact '$remote_addr "$request" $status $body_bytes_sent';
    access_log /dev/stdout compact;

    client_body_temp_path @@RUN_DIR@@/nginx/body;
    proxy_temp_path @@RUN_DIR@@/nginx/proxy;
    fastcgi_temp_path @@RUN_DIR@@/nginx/fastcgi;
    uwsgi_temp_path @@RUN_DIR@@/nginx/uwsgi;
    scgi_temp_path @@RUN_DIR@@/nginx/scgi;

    upstream core {
        server unix:@@CORE_SOCKET@@;
    }

    server {
        listen @@BOOT_PORT@@;

        location = /healthz {
            proxy_pass http://core;
        }

        # Only iPXE endpoints are exposed. The core's /api/ routes stay on its socket.
        location /ipxe/ {
            proxy_pass http://core;
            proxy_set_header X-Real-IP $remote_addr;
            # Debian netboot files can take a while to download on first use.
            proxy_read_timeout 300s;
        }

        location /files/ {
            alias @@RUN_DIR@@/mnt/;
            autoindex on;
        }

        location /raw/ {
            alias @@RUN_DIR@@/raw/;
        }

        location /loaders/ {
            alias @@TFTP_ROOT@@/;
        }

        location /netboot/ {
            alias @@RUN_DIR@@/netboot/;
        }

        location / {
            return 404;
        }
    }
}
