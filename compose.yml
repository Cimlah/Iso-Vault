services:
  iso-vault:
    image: ghcr.io/cimlah/iso-vault:${ISO_VAULT_TAG:-latest}
    build: .
    container_name: iso-vault
    # DHCP needs LAN broadcasts, and TFTP replies from ephemeral ports.
    network_mode: host
    # Needed for read-only loop mounts of ISOs. See docs/troubleshooting.md to run without it.
    privileged: true
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: .env
        required: false
    volumes:
      - ${ISO_DIR:-./isos}:/isos:ro
      - ${DRIVERS_DIR:-./drivers}:/drivers:ro
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "python3", "-m", "isovault", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
